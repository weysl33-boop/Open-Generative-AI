server {
    listen 80;
    listen [::]:80;
    server_name www.koyosim.com koyosim.com;

    location ^~ /.well-known/acme-challenge/ {
        root /home/wwwroot/AI/domain/koyosim.com/web;
        default_type text/plain;
    }

    location / {
        return 301 https://www.koyosim.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name koyosim.com;

    ssl_certificate /etc/letsencrypt/live/koyosim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koyosim.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.koyosim.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.koyosim.com;

    ssl_certificate /etc/letsencrypt/live/koyosim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koyosim.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WWW_KOYOSIM_SSL:10m;
    ssl_session_timeout 1d;

    # 1. 静态资源磁盘直出 + 1 年强缓存 + 代理平滑回退
    location /_next/static/ {
        alias /home/wwwroot/AI/domain/koyosim.com/web/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @node_backend;
    }

    # 2. 站点图标与机器人协议直出
    location = /favicon.ico {
        root /home/wwwroot/AI/domain/koyosim.com/web/public;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        root /home/wwwroot/AI/domain/koyosim.com/web/public;
        access_log off;
        log_not_found off;
    }

    # 3. 全站动态与 API 反向代理
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location @node_backend {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /home/wwwroot/AI/logs/www.koyosim.com-access.log;
    error_log /home/wwwroot/AI/logs/www.koyosim.com-error.log warn;
}
